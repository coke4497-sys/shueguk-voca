<script>
/* ══ 교사 페이지 조용한 인증 (2026-08-25, 3단계) ═══════════════════════
 * 이 아래 연결부들이 수파베이스에 보내는 요청에 '교사 신분'을 붙인다.
 * 화면에 로그인 창은 없다 — 페이지가 열릴 때 알아서 받아 온다.
 *
 * 왜 필요한가:
 *   공개 키(sb_publishable_…)는 학생이 여는 페이지에도 들어 있어서, 그 키로 표를
 *   직접 읽을 수 있으면 전교생 명단(학생ID=비밀번호·접근코드)이 새어 나간다.
 *   그래서 공개 키에서는 표 접근을 없애고(anon), 표는 이 신분(authenticated)만
 *   읽고 쓰도록 나눴다. 학생 화면은 표 대신 함수(student_bundle 등)를 쓴다.
 *
 * 주의:
 *   · 이 조각은 **교사용 페이지에만** 넣는다. 학생이 여는 페이지(s·r·클리닉 신청·
 *     모의고사 신청·H WORK 제출)에는 절대 넣지 말 것 — 넣는 순간 위 보호가 무의미해진다.
 *   · 아래 연결부들이 시작할 때 window.fetch 를 붙잡아 두므로, 이 조각은 **그것들보다
 *     먼저** 실행돼야 한다. 페이지의 첫 스크립트 자리를 지킬 것.
 *   · 인증이 실패하면 예전처럼 공개 키로 보낸다(권한을 회수하기 전까지는 그래도 동작). */
(function(){
  var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var T_ID = 'teachers@shueguk.internal';
  var T_PW = 'shg_FCePWvnawH44SV8kYB9BHRKi6aag';
  var tok = null, until = 0, pending = null;
  var raw = window.fetch.bind(window);

  function auth(){
    if (tok && Date.now() < until) return Promise.resolve(tok);
    if (pending) return pending;
    pending = raw(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: T_ID, password: T_PW })
    }).then(function(r){ return r.json(); }).then(function(d){
      pending = null;
      if (!d || !d.access_token) throw new Error('teacher auth');
      tok = d.access_token;
      until = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;   // 만료 5분 전에 다시 받는다
      return tok;
    }, function(e){ pending = null; throw e; });
    return pending;
  }
  function withAuth(url, opts, t){
    var src = (opts && opts.headers) || {}, h = {};
    if (src.forEach && !src.hasOwnProperty) src.forEach(function(v, k){ h[k] = v; });
    else for (var k in src) h[k] = src[k];
    h['apikey'] = SB_KEY;
    h['Authorization'] = 'Bearer ' + t;
    var o = {}; for (var k2 in (opts || {})) o[k2] = opts[k2];
    o.headers = h;
    return o;
  }
  window.fetch = function(url, opts){
    var u = (typeof url === 'string') ? url : ((url && url.url) || '');
    if (u.indexOf(SB_URL + '/rest/v1') !== 0) return raw(url, opts);
    return auth().then(function(t){
      return raw(url, withAuth(url, opts, t)).then(function(r){
        if (r.status !== 401) return r;
        tok = null; until = 0;                       // 만료가 겹쳤으면 한 번만 다시 받아 재시도
        return auth().then(function(t2){ return raw(url, withAuth(url, opts, t2)); });
      });
    }, function(){ return raw(url, opts); });
  };
})();
</script>
<script>
(function() {
    /* ===== 설정 ===== */
    // 어휘 학생 테스트(test.html)가 결과를 보내는 Apps Script와 같은 배포 주소.
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxW4aXPUq9Iu3VtnjHuInUxhG6dPaNIYawDRWTYEjvEIsv4kjEceXDb_y9OX5Lx3-9e/exec';
    var ACCESS_KEY = 'shueguk2026';   // ← Apps Script의 ACCESS_KEY와 똑같이 맞추세요.

    var ALL = [];     // 전체 행
    var VIEW = [];    // 현재 필터로 보이는 행
    var selected = {};// 선택된 행 (key: _row:_sig)
    var SHEET_READY = false;   // 원본(시트) 목록이 도착했나 — 도착 전엔 선택·삭제를 막는다
    function $(id){ return document.getElementById(id); }
    function rowId(r){ return r._row + ':' + r._sig; }
    function selCount(){ return Object.keys(selected).length; }

    /* ── 첫 화면은 수파베이스에서 (2026-08-25) ─────────────────────
     * 시트 조회는 구글 서버가 시트를 읽는 시간 때문에 2~4초가 걸린다(제출이 몰리면 더).
     * 미러(voca_results)는 같은 내용을 1초 안에 준다 — 그래서 화면은 미러로 먼저 그리고,
     * 원본인 시트 목록은 뒤에서 마저 받아 대조한다.
     *
     * 삭제는 시트의 행번호·해시(_row/_sig)가 있어야 하므로, 시트가 도착하기 전에는
     * 체크박스를 잠가 둔다. 도착하면 같은 줄에 _row/_sig를 붙이고 그대로 풀어 준다
     * (내용이 같으면 다시 그리지 않아 화면이 흔들리지 않는다).
     * 어긋나면 원본인 시트 쪽으로 다시 그리고 몇 건 다른지 알려 준다. */
    var SB_PAGE = 1000;   // 수파베이스 한 번에 주는 최대 줄 수

    function loadFast(){
        var url = SB_REST + '/voca_results?select=id,ts,name,school,grade,phone4,round,score' +
                  '&order=id.asc&limit=' + SB_PAGE + '&offset=';
        var H = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
        function page(off){
            return fetch(url + off, { headers: H, cache: 'no-store' })
                .then(function(r){ if (!r.ok) throw new Error('sb ' + r.status); return r.json(); });
        }
        /* 한 번에 1000줄까지만 오므로 여러 쪽을 나눠 받는데, 반드시 **동시에** 받는다.
         * 차례로 받으면 왕복이 쌓여 시트 조회보다 느려진다(2026-08-25 측정에서 실제로 그랬다). */
        var out = [];
        function grab(from, span){
            var jobs = [];
            for (var i = 0; i < span; i++) jobs.push(page(from + i * SB_PAGE));
            return Promise.all(jobs).then(function(pages){
                pages.forEach(function(rows){ out = out.concat(rows); });
                var last = pages[pages.length - 1];
                if (last.length === SB_PAGE && out.length < 20000) return grab(from + span * SB_PAGE, span);
            });
        }
        grab(0, 4).then(function(){
            if (SHEET_READY || !out.length) return;   // 시트가 이미 왔으면 원본이 우선
            ALL = withKeys(out.map(function(r){
                return normalizeRow({ time: r.ts, name: r.name, school: r.school, grade: r.grade,
                                      phone4: r.phone4, round: r.round, score: r.score, details: '' });
            }));
            buildFilters(); applyFilters();
            renderParticipation();
        }).catch(function(){ /* 실패해도 무해 — 시트 조회가 화면을 그린다 */ });
    }

    /* 두 곳에서 온 같은 줄을 잇기 위한 키 (같은 내용이 여러 번이면 #1,#2…) */
    function keyOf(r){ return r.timeDisplay + '|' + r.name + '|' + r.round + '|' + r.score; }
    function withKeys(rows){
        var seen = {};
        rows.forEach(function(r){
            var k = keyOf(r);
            seen[k] = (seen[k] || 0) + 1;
            r._key = k + '#' + seen[k];
        });
        return rows;
    }

    /* ===== JSONP 로더 ===== */
    function loadData(opts){
        opts = opts || {};   // opts.full: 상세 포함 전체(CSV용), opts.done: 성공 콜백
        showStatus('loading', opts.full ? '상세 포함 전체를 불러오는 중… (조금 걸려요)' : '결과를 불러오는 중…');
        var cb = 'shueguk_cb_' + Date.now();
        var done = false;
        var timer = setTimeout(function(){ if (!done){ done = true; cleanup(); showStatus('fail', '서버 응답이 늦어지고 있어요. 잠시 후 [새로고침]을 눌러 주세요. (접속이 몰리는 시간대에 발생할 수 있어요)'); } }, opts.full ? 60000 : 45000);
        window[cb] = function(resp){
            if (done) return; done = true; clearTimeout(timer); cleanup();
            if (!resp || resp.ok !== true){
                showStatus('fail', '' + (resp && resp.error === 'unauthorized' ? '비밀키(ACCESS_KEY)가 일치하지 않습니다.' : '데이터를 가져오지 못했습니다.'));
                return;
            }
            var sheetRows = withKeys((resp.rows || []).map(normalizeRow));

    /* 미러로 그려 둔 줄에 시트의 행번호·해시를 붙인다.

    function attachToFast(sheetRows){
        if (!ALL.length) return false;                 // 미러가 아직 안 왔을 뿐 — 어긋난 게 아니다

    /* ── 수파베이스 미러 (2026-08-23 DB 이전) — 삭제 성공 시 미러(voca_results)에서도 같은 행 삭제.

    var SB_REST = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';

    function fmtTime(raw){
        raw = '' + (raw==null ? '' : raw);
        if (!raw) return '';
        // 시트가 날짜로 변환해 ISO(UTC)로 넘어온 경우 → 한국 시간으로 표시
        if (raw.indexOf('T') >= 0 || raw.indexOf('Z') >= 0) {
            var d = new Date(raw);
            if (!isNaN(d.getTime())) {
                try {
                    var o = {};
                    new Intl.DateTimeFormat('ko-KR', {
                        timeZone: 'Asia/Seoul', hourCycle: 'h23',
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    }).formatToParts(d).forEach(function(p){ o[p.type] = p.value; });
                    return o.year + '-' + o.month + '-' + o.day + ' ' + o.hour + ':' + o.minute;
                } catch (e) {}
            }
        }
        return raw;   // 이미 보기 좋은 문자열이면 그대로
    }

    /* 새로 불러온 데이터에 없는 선택은 정리 */

    /* 상세: 줄 단위로 색칠 (틀린 문항=빨강). 맨 위에 점수·정답률·틀린 개수 요약 */

    /* ── 표는 나눠서 그린다 (2026-08-24)

        if (!ALL.length){ card.style.display = 'none'; return; }
        var parts = {}, partNames = {};
        ALL.forEach(function(r){
            var g = normGrade(r.grade); if (!g || !r.round) return;
            var k = r.round + '|' + g;
            (parts[k] = parts[k] || {})[r.name + '|' + r.phone4] = 1;
            (partNames[k] = partNames[k] || {})[pnorm(r.name)] = 1;
        });
        var rounds = uniq(ALL.map(function(r){ return r.round; })).filter(Boolean)
            .sort(function(a,b){ return parseFloat(a) - parseFloat(b); });
        var grades = GRADE_ORDER.filter(function(g){
            var hasRoster = PART_ROSTER && PART_ROSTER[g] && PART_ROSTER[g].length;
            var hasSub = rounds.some(function(rd){ return parts[rd + '|' + g]; });
            return hasRoster || hasSub;
        });
        if (!rounds.length || !grades.length){ card.style.display = 'none'; return; }

        $('part-head').innerHTML = '<tr><th>주차</th>' + grades.map(function(g){
            var d = PART_ROSTER && PART_ROSTER[g] ? PART_ROSTER[g].length : null;
            return '<th>' + g + (OPTIONAL_GRADES[g] ? '<span class="opt-tag">자율</span>' : '') +
                (d != null ? '<br><span style="font-weight:400;font-size:10.5px;">재원 ' + d + '</span>' : '') + '</th>';
        }).join('') + '</tr>';

        $('part-body').innerHTML = rounds.map(function(rd){
            return '<tr><td class="wk-cell">' + esc(rd) + '주차</td>' + grades.map(function(g){
                var n = Object.keys(parts[rd + '|' + g] || {}).length;
                var d = PART_ROSTER && PART_ROSTER[g] ? PART_ROSTER[g].length : null;
                var opt = !!OPTIONAL_GRADES[g];
                var inner;
                if (d){
                    var p = Math.round(n / d * 100);
                    /* 자율 참여 학년은 회색 배지 — 낮아도 빨간 경고를 주지 않음 */
                    inner = '<span class="frac">' + n + '/' + d + '</span> <span class="pct ' + (opt ? 'opt' : pctClass(p)) + '">' + p + '%</span>';
                } else {
                    inner = '<span class="frac">' + n + '명</span>';
                }
                return '<td class="p-cell' + (opt ? ' p-opt' : '') + '" data-rd="' + escAttr(rd) + '" data-g="' + g + '">' + inner + '</td>';
            }).join('') + '</tr>';
        }).join('');

        card.style.display = 'block';
        $('part-detail').className = 'part-detail';
        $('part-detail').innerHTML = '';

        $('part-body').querySelectorAll('.p-cell').forEach(function(td){
            td.addEventListener('click', function(){
                var on = td.classList.contains('p-on');
                $('part-body').querySelectorAll('.p-cell').forEach(function(x){ x.classList.remove('p-on'); });
                if (on){ $('part-detail').className = 'part-detail'; return; }
                td.classList.add('p-on');
                showPartDetail(td.getAttribute('data-rd'), td.getAttribute('data-g'), partNames);
            });
        });
    }

    function showPartDetail(rd, g, partNames){
        var box = $('part-detail');
        var roster = (PART_ROSTER && PART_ROSTER[g]) || [];
        if (!roster.length){
            box.innerHTML = '<div class="pd-head">' + esc(rd) + '주차 ' + g + '<span class="pd-note">재원 명단이 없어 미응시자를 계산할 수 없어요.</span></div>';
            box.className = 'part-detail show'; return;
        }
        var done = partNames[rd + '|' + g] || {};
        var todo = roster.filter(function(s){ return !done[pnorm(s.name)]; });
        var opt = !!OPTIONAL_GRADES[g];
        var head = '<div class="pd-head">' + esc(rd) + '주차 ' + g + ' ' + (opt ? '미참여' : '미응시') + ' ' + todo.length + '명 / 재원 ' + roster.length + '명' +
            '<span class="pd-note">' + (opt ? '자율 참여 학년입니다. ' : '') + '이름 기준 대조 — 학생이 학년·이름을 잘못 입력하면 미응시로 보일 수 있어요.</span></div>';
        box.innerHTML = head + (todo.length
            ? '<div class="part-chips' + (opt ? ' opt' : '') + '">' + todo.map(function(s){
                return '<span class="pc">' + esc(s.name) + ' <span class="sc">' + esc(s.school || '') + '</span></span>';
              }).join('') + '</div>'
            : '<p class="muted">모두 응시했어요.</p>');
        box.className = 'part-detail show';
    }

    /* ===== CSV ===== */
    function toCSV(rows){
        var head = ['제출시각','이름','학교','학년','전화4','주차','점수','정답률','상세'];
        function q(v){ v = '' + (v==null?'':v); return '"' + v.replace(/"/g,'""') + '"'; }
        var lines = [head.map(q).join(',')];
        rows.forEach(function(r){ lines.push([r.timeDisplay,r.name,r.school,r.grade,r.phone4,r.round,r.score,(r.pct===null?'':r.pct+'%'),r.details].map(q).join(',')); });
        return '﻿' + lines.join('\r\n');   // BOM: 엑셀 한글 깨짐 방지
    }
    function downloadCSV(){
        var rows = getFiltered();
        var needFull = rows.some(function(r){ return !r._hasDetails; });
        if (needFull){   // 목록은 lite(상세 없음) — CSV에는 상세가 들어가므로 전체를 한 번 받아온다
            loadData({ full: true, done: downloadCSV });
            return;
        }
        var blob = new Blob([toCSV(rows)], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = 'shueguk_vocab_results_' + new Date().toISOString().slice(0,10) + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
    }

    /* ===== 이벤트 ===== */
    ['f-grade','f-round'].forEach(function(id){ $(id).addEventListener('change', applyFilters); });
    $('f-name').addEventListener('input', applyFilters);
    $('btn-refresh').addEventListener('click', function(){ SHEET_READY = false; loadFast(); loadData(); });
    $('btn-csv').addEventListener('click', downloadCSV);
    $('btn-delete').addEventListener('click', deleteSelected);
    $('chk-all').addEventListener('change', function(){
        var on = $('chk-all').checked;
        // 선택은 화면에 그려진 줄뿐 아니라 지금 필터에 걸린 전체(VIEW)에 적용된다
        if (!SHEET_READY){ $('chk-all').checked = false; return; }
        VIEW.forEach(function(r){ if (!r._row) return; var id = rowId(r); if (on) selected[id] = 1; else delete selected[id]; });
        $('tbody').querySelectorAll('.row-chk').forEach(function(c){
            c.checked = on;
            var tr = c.closest('tr'); if (tr) tr.className = on ? 'sel-on' : '';
        });
        syncSelUI();
    });
    loadFast();        // 미러에서 먼저 그리고
    loadData();        // 원본(시트)으로 대조·확정
    loadPartRoster();
})();
</script>
</body>
</html>
